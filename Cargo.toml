[package]
name = "voxel"
version = "0.1.0"
edition = "2024"
default-run = "main"

[[bin]]
name = "main"
path = "src/chapter20.rs"

#[[bin]]
#name = "structure_editor"
#path = "src/structure_editor.rs"

[[bin]]
name = "noise_viewer"
path = "src/noise_viewer.rs"

[features]
chapter-01 = []
chapter-02 = ["chapter-01"]
chapter-03 = ["chapter-02"]
chapter-04 = ["chapter-03"]
chapter-05 = ["chapter-04"]
chapter-06 = ["chapter-05"]
chapter-07 = ["chapter-06"]
chapter-08 = ["chapter-07"]
chapter-09 = ["chapter-08"]
chapter-10 = ["chapter-09"]
chapter-11 = ["chapter-10"]
chapter-12 = ["chapter-11"]
chapter-13 = ["chapter-12"]
chapter-14 = ["chapter-13"]
chapter-15 = ["chapter-14"]
chapter-16 = ["chapter-15"]
chapter-17 = ["chapter-16"]
chapter-18 = ["chapter-17"]
chapter-19 = ["chapter-18"]
chapter-20 = ["chapter-19"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
async-channel = "2.5.0"
async-compat = "0.2.6"
axum = { version = "0.8.9", features = ["ws"] }
better_default = "1.0.5"
bevy = { version = "0.20.1", features = ["dynamic_linking", "pan_orbit_camera"] }
bevy-inspector-egui = "0.38.0"
egui_dock = "0.21.1"
gif = "0.14.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = { version = "0.4.35", features = ["max_level_debug", "release_max_level_warn"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
wincode = { version = "0.6.3", features = ["derive"] }
wgpu = { version = "30.0.1", default-features = false }
