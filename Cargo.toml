[package]
name = "voxel"
version = "0.1.0"
edition = "2024"
default-run = "chapter17"

[[bin]]
name = "chapter17"
path = "src/chapter17.rs"

[[bin]]
name = "chapter16"
path = "src/chapter16.rs"

[[bin]]
name = "chapter15"
path = "src/chapter15.rs"

[[bin]]
name = "chapter14"
path = "src/chapter14.rs"

[[bin]]
name = "chapter13"
path = "src/chapter13.rs"

[[bin]]
name = "chapter12"
path = "src/chapter12.rs"

[[bin]]
name = "chapter11"
path = "src/chapter11.rs"

[[bin]]
name = "chapter10"
path = "src/chapter10.rs"

[[bin]]
name = "chapter09"
path = "src/chapter09.rs"

[[bin]]
name = "chapter08"
path = "src/chapter08.rs"

[[bin]]
name = "chapter07"
path = "src/chapter07.rs"

[[bin]]
name = "chapter06"
path = "src/chapter06.rs"

[[bin]]
name = "chapter05"
path = "src/chapter05.rs"

[[bin]]
name = "chapter04"
path = "src/chapter04.rs"

[[bin]]
name = "chapter03"
path = "src/chapter03.rs"

[[bin]]
name = "chapter02"
path = "src/chapter02.rs"

[[bin]]
name = "chapter01"
path = "src/chapter01.rs"

[[bin]]
name = "noise_viewer"
path = "src/noise_viewer.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
better_default = "1.0.5"
bevy = { version = "0.20.1", features = ["dynamic_linking", "pan_orbit_camera"] }
bevy-inspector-egui = "0.38.0"
egui_dock = "0.21.1"
gif = "0.14.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = { version = "0.4.35", features = ["max_level_debug", "release_max_level_warn"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
wincode = { version = "0.6.3", features = ["derive"] }
