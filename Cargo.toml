[package]
name = "voxel"
version = "0.1.0"
edition = "2024"
default-run = "main"

[[bin]]
name = "main"
path = "src/chapter17.rs"

[[bin]]
name = "chapter16"
path = "src/chapter16.rs"

[[bin]]
name = "chapter15"
path = "src/chapter15.rs"

[[bin]]
name = "chapter14"
path = "src/chapter14.rs"

[[bin]]
name = "noise_viewer"
path = "src/noise_viewer.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
async-compat = "0.2.6"
axum = { version = "0.8.9", features = ["ws"] }
better_default = "1.0.5"
bevy = { version = "0.20.1", features = ["dynamic_linking", "pan_orbit_camera"] }
bevy-inspector-egui = "0.38.0"
egui_dock = "0.21.1"
gif = "0.14.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = { version = "0.4.35", features = ["max_level_debug", "release_max_level_warn"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
wincode = { version = "0.6.3", features = ["derive"] }
