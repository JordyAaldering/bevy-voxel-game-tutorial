[package]
name = "voxel"
version = "0.1.0"
edition = "2024"
default-run = "main"

[[bin]]
name = "main"
path = "src/chapter04.rs"

#[[bin]]
#name = "structure_editor"
#path = "src/structure_editor.rs"

[[bin]]
name = "noise_viewer"
path = "src/noise_viewer.rs"

[features]
default = ["chapter04"]
chapter01 = []
chapter02 = ["chapter01"]
chapter03 = ["chapter02"]
chapter04 = ["chapter03"]
chapter05 = ["chapter04"]
chapter06 = ["chapter05"]
chapter07 = ["chapter06"]
chapter08 = ["chapter07"]
chapter09 = ["chapter08"]
chapter10 = ["chapter09"]
chapter11 = ["chapter10"]
chapter12 = ["chapter11"]
chapter13 = ["chapter12"]
chapter14 = ["chapter13"]
chapter15 = ["chapter14"]
chapter16 = ["chapter15"]
chapter17 = ["chapter16"]
chapter18 = ["chapter17"]
chapter19 = ["chapter18"]
chapter20 = ["chapter19"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
async-channel = "2.5.0"
async-compat = "0.2.6"
axum = { version = "0.8.9", features = ["ws"] }
better_default = "1.0.5"
bevy = { version = "0.20.1", features = ["dynamic_linking", "pan_orbit_camera"] }
bevy-inspector-egui = "0.38.0"
egui_dock = "0.21.1"
gif = "0.14.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = { version = "0.4.35", features = ["max_level_debug", "release_max_level_warn"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
wincode = { version = "0.6.3", features = ["derive"] }
wgpu = { version = "30.0.1", default-features = false }
